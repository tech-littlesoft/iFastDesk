# iFastDesk 官方主页 — GitHub Pages (Jekyll) 配置
# 直接 push 到 main 分支，由 GitHub Pages 自动用此配置构建并发布。
# 不使用任何第三方主题与 CDN，全部用仓库内自定义布局/样式，国内可直连。

title: iFastDesk 小迅桌面站
description: >-
  iFastDesk 小迅桌面站（悬浮桌面 / 桌面工作站）官方主页与功能亮点介绍。
  iFastDesk Desktop Workstation (Floating Desktop / XiaoXun Desktop) — official homepage & feature highlights.
lang: zh-CN

# 站点地址（已绑定自有域名 www.ifastdesk.com，由 GitHub Pages 提供）
url: https://www.ifastdesk.com
# 自定义域名直接绑定到根路径，baseurl 留空；全站链接/资源均通过 relative_url 过滤器
# 与 <base href="{{ site.baseurl }}/"> 走相对路径，因此换域名、换仓库名都不必改动任何链接。
baseurl: ""

# 若暂时退回 GitHub Pages 默认域名（未绑自定义域名时），则改成：
#   url: https://tech-littlesoft.github.io
#   baseurl: /iFastDesk   # 等于仓库名
# 并在仓库根目录放置 CNAME 文件（内容为 www.ifastdesk.com），详见 README.md

# 不使用第三方主题，使用仓库内 _layouts/app.html（产品站）+ _layouts/nav.html（导航站）+ 各自 css
theme: null

# 三页都启用 pretty URL（去掉 .html 后缀），与各页 front matter 的 permalink 配合
permalink: pretty

# 发布时排除仓库说明文件（不进入站点）
exclude:
  - README.md
  - LICENSE