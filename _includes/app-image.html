{%- assign media = site.data.app_media.images[include.id] -%}
<figure id="{{ include.ref }}" class="app-media app-screenshot{% if include.hero %} app-media-hero{% endif %}">
  <a class="media-open" href="{{ media.full | relative_url }}" data-media-image data-caption="{{ include.caption | escape }}" aria-label="{{ include.alt | escape }}，点击放大">
    <picture>
      <source type="image/webp" srcset="{% for variant in media.variants %}{{ variant.webp | relative_url }} {{ variant.width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}" sizes="{{ include.sizes | default: '(max-width: 820px) calc(100vw - 32px), (max-width: 1200px) calc(100vw - 268px), 1100px' }}">
      <img src="{{ media.fallback | relative_url }}" srcset="{% for variant in media.variants %}{{ variant.jpeg | relative_url }} {{ variant.width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}" sizes="{{ include.sizes | default: '(max-width: 820px) calc(100vw - 32px), (max-width: 1200px) calc(100vw - 268px), 1100px' }}" width="{{ media.width }}" height="{{ media.height }}" alt="{{ include.alt | escape }}" decoding="async" {% if include.hero %}fetchpriority="high" loading="eager"{% else %}loading="lazy"{% endif %}>
    </picture>
    <span class="media-zoom" aria-hidden="true">↗</span>
  </a>
  <figcaption><a class="media-id" href="{{ page.url | relative_url }}#{{ include.ref }}">{{ include.ref }}</a> {{ include.caption }}</figcaption>
</figure>
