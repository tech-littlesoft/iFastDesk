<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="{{ site.baseurl }}/">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/nav.css' | relative_url }}" />
</head>
<body class="nav-page">
  <header class="nav-bar">
    <a class="nav-logo" href="{{ '/' | relative_url }}" aria-label="iFastDesk 导航主页">
      {% include logo.html class="nav-mark" %}
      <span class="nav-logo-text">
        <span class="nav-logo-name">iFastDesk</span>
        <span class="nav-logo-sub">导航 · 小迅桌面站</span>
      </span>
    </a>
    <a class="nav-bar-cta" href="{{ '/app/buy/' | relative_url }}">获取 Pro</a>
  </header>

  <main class="nav-main">
    {{ content }}
  </main>

  <footer class="nav-footer">
    <p>© {{ site.time | date: '%Y' }} iFastDesk · 悬浮桌面 / 小迅桌面站</p>
  </footer>
</body>
</html>
