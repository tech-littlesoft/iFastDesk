<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="{{ site.baseurl }}/">
  <title>{{ page.title | default: site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/nav.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}" />
</head>
<body class="nav-page">
  <header class="nav-bar">
    <a class="nav-logo" href="{{ '/' | relative_url }}" aria-label="iFastDesk 导航主页">
      {% include logo.html class="nav-mark" %}
      <span class="nav-logo-text">
        <span class="nav-logo-name">iFastDesk</span>
        <span class="nav-logo-sub">小讯云端 · 网址导航</span>
      </span>
    </a>
  </header>

  <main class="nav-main">
    {{ content }}
  </main>

  <footer class="nav-footer">
    <div class="nav-foot-links">
      <a href="{{ '/' | relative_url }}">首页</a>
      <a href="{{ '/app/' | relative_url }}">产品介绍</a>
      <a href="{{ '/app/buy/' | relative_url }}">升级 Pro</a>
      <a href="{{ '/app/guide/' | relative_url }}">使用指南</a>
      <a href="{{ '/app/privacy/' | relative_url }}">隐私说明</a>
      <a href="mailto:{{ site.contact_email }}?subject={{ '友情链接' | uri_escape }}">友情链接</a>
      <a href="mailto:{{ site.contact_email }}?subject={{ '网站收录' | uri_escape }}">网站收录</a>
      <a href="mailto:{{ site.contact_email }}">联系我们</a>
    </div>
    <p>© {{ site.time | date: '%Y' }} iFastDesk · 小讯云端 · 网址导航　|　你的高效上网起点</p>
    <p class="icp">本导航仅收录公开常用网站，与所列网站无隶属关系</p>
  </footer>
</body>
</html>
